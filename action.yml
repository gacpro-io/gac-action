name: 'GAC Pro Governance-as-Code'
description: 'Pull a policy bundle from GAC Pro, verify its signature, evaluate it with OPA, and post results'
inputs:
  facts:
    description: 'Path to the facts JSON file'
    required: false
    default: '.gacpro/facts.json'
  signer-identity:
    description: 'Exact trusted signing certificate URI'
    required: false
  signer-issuer:
    description: 'Trusted signing certificate OIDC issuer'
    required: false
  propose:
    description: 'Open a PR if governance config has drifted from the compiled bundle'
    required: false
    default: 'false'
  token:
    description: 'GAC Pro API token (repository secret GACPRO_TOKEN)'
    required: true
  system-id:
    description: 'AI system ID in GAC Pro'
    required: true
  base-url:
    description: 'GAC Pro API base URL'
    required: false
    default: 'https://gacpro.io'
  comment:
    description: 'Post a summary comment on the PR (default: false)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # V108-2-3 review M5: OPA is downloaded directly and checked against a pinned sha256 per platform
    # (the upstream setup action downloads it unverified). OPA never sees the token (src/evaluate.ts opaEnv).
    - name: Install OPA 1.0.1 (pinned by sha256)
      id: opa
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}" in
          Linux/X64)   ASSET=opa_linux_amd64_static;  SHA=6d81be862e412af910eacfad489e3d77afbfcf4b958ea4e839b7f38c9eec4d87 ;;
          Linux/ARM64) ASSET=opa_linux_arm64_static;  SHA=6edc31f51377abee0c7f07ff01622c2b03346f18483d95ad84f239aae5c9f6a8 ;;
          macOS/X64)   ASSET=opa_darwin_amd64;        SHA=48aec3a9c7c9f54200dc213010905369f1c14ecc0594585b3fa41ae7a218c753 ;;
          macOS/ARM64) ASSET=opa_darwin_arm64_static; SHA=50d4a57dfad46f63332c2a48b5fec641ecd6ae925399d3b08e9fc90de47bf1e6 ;;
          Windows/X64) ASSET=opa_windows_amd64.exe;   SHA=100c670c28844018c8f5ed90e9fed4866f39eb03c79be59426dfd54ad79c9fc3 ;;
          *) echo "::error::GAC Pro pins no OPA build for ${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}"; exit 1 ;;
        esac
        DIR="${RUNNER_TEMP}/gacpro-opa"
        mkdir -p "$DIR"
        BIN="$DIR/opa"
        if [ "${RUNNER_OS_NAME}" = Windows ]; then BIN="$DIR/opa.exe"; fi
        curl -fsSL --proto '=https' --retry 3 -o "$BIN" "https://github.com/open-policy-agent/opa/releases/download/v1.0.1/${ASSET}"
        echo "${SHA}  ${BIN}" | sha256sum --check --strict -
        chmod +x "$BIN"
        echo "path=${BIN}" >> "$GITHUB_OUTPUT"
    - name: Pull bundle, evaluate, and post results
      shell: bash
      env:
        OPA_PATH: ${{ steps.opa.outputs.path }}
        GACPRO_FACTS: ${{ inputs.facts }}
        SIGNER_IDENTITY: ${{ inputs.signer-identity }}
        SIGNER_ISSUER: ${{ inputs.signer-issuer }}
        GACPRO_PROPOSE: ${{ inputs.propose }}
        GACPRO_TOKEN: ${{ inputs.token }}
        GACPRO_SYSTEM_ID: ${{ inputs.system-id }}
        GACPRO_BASE_URL: ${{ inputs.base-url }}
        GACPRO_COMMENT: ${{ inputs.comment }}
      run: |
        args=()
        if [ -n "$SIGNER_IDENTITY" ]; then args+=(--signer-identity "$SIGNER_IDENTITY"); fi
        if [ -n "$SIGNER_ISSUER" ]; then args+=(--signer-issuer "$SIGNER_ISSUER"); fi
        node "${{ github.action_path }}/dist/release/cli.mjs" evaluate \
          --token "$GACPRO_TOKEN" \
          --system "$GACPRO_SYSTEM_ID" \
          --base-url "$GACPRO_BASE_URL" \
          --commit "${{ github.sha }}" "${args[@]}"
